name: Deploy DevOps Infrastructure

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4  # Updated from v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4  # Updated from v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3  # Updated from v2
        with:
          terraform_version: 1.5.0

      - name: Terraform Init
        run: cd environments/dev && terraform init

      - name: Terraform Plan
        run: cd environments/dev && terraform plan -no-color

      - name: Terraform Apply
        run: cd environments/dev && terraform apply -auto-approve -no-color

      - name: Get EC2 Public IP
        id: get_ip
        run: |
          cd environments/dev
          EC2_IP=$(terraform output -raw ec2_public_ip)
          echo "EC2_IP=$EC2_IP" >> $GITHUB_ENV
          echo "ec2_ip=$EC2_IP" >> $GITHUB_OUTPUT  # Fixed deprecated set-output

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Install Ansible
        run: |
          sudo apt update
          sudo apt install ansible -y
          pip install boto3

      - name: Disable SSH Host Key Checking
        run: |
          echo "[defaults]" > ansible.cfg
          echo "host_key_checking = False" >> ansible.cfg

      - name: Create Ansible Inventory
        run: |
          mkdir -p environments/dev
          echo "[webservers]" > environments/dev/inventory
          echo "${{ env.EC2_IP }} ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa" >> environments/dev/inventory

      - name: Run Ansible Playbook
        run: ansible-playbook -i environments/dev/inventory ansible/playbooks.yml

      - name: Deployment Complete
        run: |
          echo "✅ Infrastructure and application deployed successfully!"
          echo "🌐 Access your application at:"
          echo "http://${{ env.EC2_IP }}"
